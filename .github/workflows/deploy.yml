name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # 00:30 IST daily, so a talk moves from "coming up" to the archive the day after it happens.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-opalcc
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build only (deploy not switched on)
        if: vars.OPALCC_DEPLOY != 'true'
        run: python build.py
        env:
          TZ: Asia/Kolkata
      - name: Install the deploy key
        if: vars.OPALCC_DEPLOY == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OPALCC_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cp deploy/opalcc/known_hosts ~/.ssh/known_hosts
        env:
          OPALCC_SSH_KEY: ${{ secrets.OPALCC_SSH_KEY }}
      - name: Build and upload to Opalstack
        if: vars.OPALCC_DEPLOY == 'true'
        run: deploy/opalcc/deploy.sh
        env:
          OPALCC_SSH: navincc@opal2.opalstack.com
          PYTHON: python
          SKIP_HEALTH: ${{ vars.SKIP_HEALTH }}
