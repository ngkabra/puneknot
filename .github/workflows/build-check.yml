name: Build check

# The site is not deployed from here. The Opalstack server pulls this repository and builds
# it itself (see deploy/opalcc/README.md). This only checks that a push still builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py
        env:
          TZ: Asia/Kolkata
